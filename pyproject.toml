[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funimage"
version = "1.0.22"
description = "A powerful Python library for image format conversion and processing"
readme = "README.md"
requires-python = ">=3.12"
keywords = [ "image", "conversion", "PIL", "opencv", "base64", "processing",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3 :: Only", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Multimedia :: Graphics",]
dependencies = [ "farlog>=1.1.7", "funfake>=1.0.3", "funget>=1.1.63", "pillow>=9.0.0", "pillow-avif-plugin>=1.4.6", "numpy>=1.20.0",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.optional-dependencies]
opencv = [ "opencv-python>=4.5.0",]

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funimage"
Releases = "https://github.com/farfarfun/funimage/releases"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.hatch.build.targets.wheel]
packages = ["src/funimage"]
